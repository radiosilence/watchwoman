name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Releases whatever version is not yet released: how a failed release is
  # retried.
  workflow_dispatch:

# A pull request's newer push cancels its older run. Runs on main are never
# cancelled, since any of them may be publishing a release, and a manual run
# is in a group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # sccache: compilation-unit cache layered on top of Swatinem's
  # target/ cache. Swatinem keys on Cargo.lock + rustc version and
  # can miss on tiny source changes; sccache hits per-crate and
  # survives cross-job (test/lint/build share the host target).
  # CARGO_INCREMENTAL=0 because incremental artifacts poison sccache
  # lookups — upstream-recommended combo.
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # Branch-scoped caches aren't readable from other branches, so a PR
          # saving here only evicts the main entry every PR restores from.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run tests
        run: cargo test --workspace --all-features

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          components: clippy

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # Branch-scoped caches aren't readable from other branches, so a PR
          # saving here only evicts the main entry every PR restores from.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Lint with Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  format:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # `rust-version` is a promise to anyone doing `cargo install`, and
  # nothing was checking it — it read 1.82 long after the tree had
  # stopped building there.  Keep the toolchain here in lockstep with
  # `rust-version` in the workspace manifest.  `--all-targets` so
  # dev-deps count too.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: "1.88"

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # Branch-scoped caches aren't readable from other branches, so a PR
          # saving here only evicts the main entry every PR restores from.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check against the declared MSRV
        run: cargo check --workspace --all-targets

  # CHANGELOG.md is generated from changelog.d/ (scripts/changelog.py). A pull
  # request adds fragments without regenerating it, so only its fragments and
  # the released versions are checked; one that writes CHANGELOG.md, as a
  # release does, must write exactly what the fragments make.
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - run: python3 -m unittest scripts/test_changelog.py
      - env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ] && git diff --name-only HEAD^1 HEAD | grep -qx CHANGELOG.md; then
            python3 scripts/changelog.py --check
          else
            python3 scripts/changelog.py --lint
          fi

  version:
    name: Version
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      # A push releases only when it changes the version. Comparing with the
      # latest GitHub release alone would let a push that lands while a release
      # is still running release the same version a second time. A manual run
      # releases whatever is unreleased.
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          version_of() { sed -n 's/^version = "\(.*\)"/\1/p' | head -1; }
          VERSION=$(version_of < Cargo.toml)
          PREVIOUS=$(git show HEAD^:Cargo.toml 2>/dev/null | version_of || true)
          LATEST=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
          if [ "$VERSION" = "${LATEST#v}" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "workflow_dispatch" ] || [ "$VERSION" != "$PREVIOUS" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # watchwoman depends on the protocol crate by path and by version, and
          # crates.io sees only the version: a stale pin publishes watchwoman
          # against the previous protocol release.
          if ! grep -q "^watchwoman-protocol = .*version = \"${VERSION}\"" Cargo.toml; then
            echo "::error::the watchwoman-protocol pin in Cargo.toml is not ${VERSION}"
            exit 1
          fi

  # Whether a pull request touches anything Linux cannot check for macOS: the
  # FSEvents watcher and the daemon around it, jemalloc, the macOS-only CLI
  # and capability code, the integration tests that drive the watcher, the
  # manifests, lockfile and toolchain, and CI itself. A changed Rust file
  # holding `target_os = "macos"` counts too, so new Apple-only code is
  # caught without editing this list. A release pull request (one that changes
  # the workspace version) always counts, so packaging is checked before the
  # version merges.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      macos: ${{ steps.diff.outputs.macos }}
      release: ${{ steps.diff.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: diff
        run: |
          # HEAD is the pull request merged into its base, so HEAD^1 is the base.
          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "$changed"
          macos=false
          if echo "$changed" | grep -qE '^(\.github/workflows/|crates/watchwoman/src/(daemon/|cli\.rs$|lib\.rs$|commands/(info|watch|debug)\.rs$)|crates/watchwoman/tests/|crates/watchwoman-tests/|(.*/)?Cargo\.(toml|lock)$|(.*/)?build\.rs$|mise\.toml$|rust-toolchain|scripts/package\.sh$)'; then
            macos=true
          fi
          for f in $(echo "$changed" | grep '\.rs$'); do
            if [ -f "$f" ] && grep -q 'target_os = "macos"' "$f"; then
              macos=true
            fi
          done
          version_of() { sed -n 's/^version = "\(.*\)"/\1/p' | head -1; }
          release=false
          if [ "$(git show HEAD:Cargo.toml | version_of)" != "$(git show HEAD^1:Cargo.toml | version_of)" ]; then
            release=true
            macos=true
          fi
          echo "macos=${macos}" | tee -a "$GITHUB_OUTPUT"
          echo "release=${release}" | tee -a "$GITHUB_OUTPUT"

  # Release artifacts are built on every pull request and every push to main,
  # not only when the version bumps, so a musl or linux-arm break fails the
  # pull request instead of the release. The release jobs below publish these
  # artifacts; nothing is rebuilt. macOS has its own job, below.
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    # Windows is intentionally absent: watchwoman is built on unix
    # sockets + nix-flavoured syscalls (setsid, inotify/FSEvents,
    # passwd lookup).  A proper Windows port needs named pipes and a
    # different watcher backend — tracked separately, not blocked on
    # this pipeline.
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux (glibc) — dynamic
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  platform: linux-amd64-gnu  }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, platform: linux-arm64-gnu  }
          # Linux (musl) — static, portable across distros
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-musl, platform: linux-amd64-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, platform: linux-arm64-musl }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.target }}
          # Four targets, so four full release target/ trees — by far the
          # largest thing this repository puts in its 10GB cache budget, and a
          # branch's copy is unreadable from every branch but its own.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --bins -p watchwoman

      - name: Package
        run: scripts/package.sh ${{ matrix.target }}

      - name: Upload tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Name is stable across runs and contains only the platform
          # — CD globs `watchwoman-*` to gather them all.
          name: watchwoman-${{ matrix.platform }}
          path: dist/*.tar.gz*
          retention-days: 30

  # The account's few macOS runners are shared by every repository, so macOS
  # takes one job over one target directory and one cache. A pull request
  # takes the runner only when `changes` finds something Linux cannot check,
  # and runs clippy and the tests, each regardless of the other's result. A
  # release pull request also builds and packages the release, unsigned, so a
  # packaging break shows before the version merges. A push to main takes the
  # runner only to release, without repeating the checks its pull request ran:
  # it builds, signs and notarises, packages and uploads in this one job.
  # Intel macOS is not built.
  macos:
    name: macOS
    needs: [changes, version]
    if: >-
      !cancelled() && !failure() &&
      (needs.changes.outputs.macos == 'true' || needs.version.outputs.should_release == 'true')
    runs-on: macos-latest
    env:
      TARGET: aarch64-apple-darwin
      CHECK: ${{ github.event_name == 'pull_request' }}
      PACKAGE: ${{ needs.changes.outputs.release == 'true' || needs.version.outputs.should_release == 'true' }}
      RELEASE: ${{ needs.version.outputs.should_release == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          components: clippy

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: macos
          # Restoring a stale ~/.cargo/bin/ over the freshly installed
          # rustup proxy leaves `cargo` pointing at a half-bootstrapped
          # rustup-init shim on the macOS arm64 runners — every
          # `cargo build` then errors with "unexpected argument 'build'
          # found / Usage: rustup-init[EXE]".  The registry/target/git
          # caches still restore; only ~/.cargo/bin/ is skipped.
          cache-bin: "false"
          # Saved only by release runs on main, which build the release
          # profile alone: pull requests restore the dependency sources from
          # it but compile clippy and the tests cold, apart from sccache hits
          # within the same pull request.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Lint with Clippy
        if: ${{ !cancelled() && env.CHECK == 'true' }}
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        if: ${{ !cancelled() && env.CHECK == 'true' }}
        run: cargo test --workspace --all-features

      - name: Build
        if: ${{ !cancelled() && env.PACKAGE == 'true' }}
        run: cargo build --release --target "$TARGET" --bins -p watchwoman

      # Developer ID signed and notarised, so the tarball runs from a browser
      # download without clearing quarantine. The action fails when a signing
      # secret is missing, so a release never ships an unsigned binary.
      - name: Sign and notarise
        if: env.RELEASE == 'true'
        uses: radiosilence/blit-workflows/macos-notarise@c8a650dfa5a0fbe012c61eab28f615c1983aee18
        with:
          binaries: |
            target/aarch64-apple-darwin/release/watchwoman
            target/aarch64-apple-darwin/release/watchman
            target/aarch64-apple-darwin/release/watchman-wait
            target/aarch64-apple-darwin/release/watchman-make
            target/aarch64-apple-darwin/release/watchman-diag
            target/aarch64-apple-darwin/release/watchmanctl
          certificate-p12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          api-key-p8: ${{ secrets.APPLE_API_KEY_P8 }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-issuer-id: ${{ secrets.APPLE_API_ISSUER_ID }}

      - name: Package
        if: ${{ !cancelled() && env.PACKAGE == 'true' }}
        run: scripts/package.sh "$TARGET"

      - name: Upload tarball
        if: env.RELEASE == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: watchwoman-macos-arm64
          path: dist/*.tar.gz*
          retention-days: 30

  # Before the GitHub release: a version on crates.io cannot be taken back, so
  # it goes out only once every check has passed, and a failure here leaves
  # nothing released for a manual run to trip over. Publishing errors on a
  # version already out, so a re-run checks the index first. The protocol crate
  # goes first, since watchwoman depends on it; watchwoman-tests is not
  # published. --no-verify because this run has already built and tested the
  # commit.
  crates:
    name: Publish to crates.io
    needs: [test, lint, format, msrv, changelog, version, build, macos]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          RUSTC_WRAPPER: ""
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_TOKEN secret is not set; skipping crates.io publish." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for crate in watchwoman-protocol watchwoman; do
            if curl -sf "https://index.crates.io/wa/tc/${crate}" | grep -q "\"vers\":\"${VERSION}\""; then
              echo "${crate} ${VERSION} is already on crates.io"
              continue
            fi
            cargo publish -p "${crate}" --locked --no-verify
          done

  # Creates the tag through the API, on the commit that was built. The notes
  # are the version's section of CHANGELOG.md.
  release:
    name: Release
    needs: [version, crates]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          awk -v h="## $VERSION" '$0==h{f=1;next} f&&/^## /{exit} f' CHANGELOG.md > notes.md
          if ! grep -q . notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: watchwoman-*
          path: artifacts
      - name: Stage release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.sha256' \) \
            -exec cp {} release/ \;
          ls -la release/
          # Five platforms, each a tarball and its sha256.
          count=$(find release -type f | wc -l | tr -d ' ')
          if [ "$count" -lt 10 ]; then
            echo "expected >=10 release files, got $count; aborting" >&2
            exit 1
          fi
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.version.outputs.version }}
          body_path: notes.md
          files: release/*

  # After the release, so the formula never names a tarball that does not
  # exist. Skips without RELEASE_TOKEN, which pushes to the tap as it does for koan and sift.
  homebrew:
    name: Update Homebrew Tap
    needs: [version, release]
    runs-on: ubuntu-latest
    steps:
      - name: Check tap token
        id: gate
        env:
          TAP_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "RELEASE_TOKEN not set; skipping tap update." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout tap
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: radiosilence/homebrew-watchwoman
          token: ${{ secrets.RELEASE_TOKEN }}
          path: tap

      - name: Download CI artifacts
        if: steps.gate.outputs.skip != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: watchwoman-*
          path: artifacts

      - name: Collect sha256s and regenerate formula
        if: steps.gate.outputs.skip != 'true'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          declare -A SHAS
          for f in $(find artifacts -name '*.tar.gz.sha256' -type f); do
            tar_name=$(basename "$f" .sha256)
            sha=$(awk '{print $1}' "$f")
            SHAS["$tar_name"]=$sha
          done
          must() {
            local key="$1"
            local val="${SHAS[$key]:-}"
            if [ -z "$val" ]; then
              echo "missing sha256 for $key" >&2
              exit 1
            fi
            echo "$val"
          }
          # Target tarball naming matches ci.yml build.Package.NAME.
          MACOS_ARM_SHA=$(must "watchwoman-${VERSION}-aarch64-apple-darwin.tar.gz")
          LINUX_ARM_SHA=$(must "watchwoman-${VERSION}-aarch64-unknown-linux-gnu.tar.gz")
          LINUX_AMD_SHA=$(must "watchwoman-${VERSION}-x86_64-unknown-linux-gnu.tar.gz")

          URL_BASE="https://github.com/radiosilence/watchwoman/releases/download/v${VERSION}"

          cat > tap/Formula/watchwoman.rb <<EOF
          class Watchwoman < Formula
            desc "Drop-in watchman replacement that doesn't eat your RAM"
            homepage "https://github.com/radiosilence/watchwoman"
            version "${VERSION}"
            license any_of: ["MIT", "Apache-2.0"]

            on_macos do
              depends_on arch: :arm64
              url "${URL_BASE}/watchwoman-${VERSION}-aarch64-apple-darwin.tar.gz"
              sha256 "${MACOS_ARM_SHA}"
            end

            on_linux do
              if Hardware::CPU.arm?
                url "${URL_BASE}/watchwoman-${VERSION}-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${LINUX_ARM_SHA}"
              else
                url "${URL_BASE}/watchwoman-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${LINUX_AMD_SHA}"
              end
            end

            def install
              %w[watchwoman watchman watchman-wait watchman-make watchman-diag watchmanctl].each do |b|
                bin.install b
              end
            end

            def caveats
              <<~EOS
                watchwoman ships a \`watchman\` binary for drop-in compatibility.
                If you previously installed facebook/fb's watchman, uninstall it
                and make sure #{HOMEBREW_PREFIX}/bin comes first on your PATH:

                  brew uninstall --ignore-dependencies watchman || true
                  which watchman   # should resolve to #{HOMEBREW_PREFIX}/bin/watchman

                See https://github.com/radiosilence/watchwoman/blob/main/docs/REPLACING_WATCHMAN.md
              EOS
            end

            test do
              assert_match "watchwoman", shell_output("#{bin}/watchwoman --version")
              assert_match "watchwoman", shell_output("#{bin}/watchman --version")
            end
          end
          EOF

      - name: Commit and push formula
        if: steps.gate.outputs.skip != 'true'
        working-directory: tap
        run: |
          set -euo pipefail
          if git diff --quiet Formula/watchwoman.rb; then
            echo "Formula already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
